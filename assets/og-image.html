<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with the command in README.md. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body {
		display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box;
		color: #f5f5f5; font-family: 'IBM Plex Sans', sans-serif;
		background:
			radial-gradient(ellipse 60% 70% at 18% 30%, rgba(225, 0, 27, 0.28), transparent 65%),
			radial-gradient(ellipse 50% 50% at 95% 110%, rgba(225, 0, 27, 0.12), transparent 60%),
			linear-gradient(180deg, #000 0%, #0a0a0a 100%);
	}
	img { width: 300px; height: 300px; border-radius: 52px; border: 2px solid rgba(255,255,255,0.85); flex: none; }
	.eyebrow { margin: 0 0 22px; color: rgb(225, 0, 27); font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
	h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 76px; font-weight: 700; line-height: 1.05; letter-spacing: -0.035em; }
	p.tag { margin: 26px 0 0; color: #a3a3a3; font-size: 30px; line-height: 1.35; }
</style>
</head>
<body>
	<img src="../public/logo.png" alt="" />
	<div>
		<p class="eyebrow">Checkout upsell for Shopify Plus</p>
		<h1>One more of what they’re already buying.</h1>
		<p class="tag">Double Up</p>
	</div>
</body>
</html>
